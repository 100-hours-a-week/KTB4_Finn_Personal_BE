name: BE CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: be-production
  cancel-in-progress: true

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/focal
      SPRING_DATASOURCE_USERNAME: focal_app
      SPRING_DATASOURCE_PASSWORD: ci-password
      JWT_SECRET_KEY: ci-test-jwt-secret-key-at-least-32-bytes
      FILE_UPLOAD_DIR: build/test-uploads

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: focal
          MYSQL_USER: focal_app
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew clean build --no-daemon

  docker:
    name: Build and push Docker image
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/focal-be:latest
            ${{ secrets.DOCKER_USERNAME }}/focal-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,DOCKER_TOKEN
          script: |
            set -e

            echo "$DOCKER_TOKEN" | docker login \
              --username "$DOCKER_USERNAME" \
              --password-stdin

            cd /home/ubuntu/focal

            docker compose pull backend
            docker compose up -d \
              --no-deps \
              --force-recreate \
              backend

            docker compose ps backend
            docker logout
