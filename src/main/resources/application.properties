spring.application.name=KTB4_Finn_Week6



spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/focal?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:focal_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

file.upload-dir=${FILE_UPLOAD_DIR:uploads}


spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token-exp-seconds=${JWT_ACCESS_TOKEN_EXP_SECONDS:3600}
jwt.refresh-token-exp-seconds=${JWT_REFRESH_TOKEN_EXP_SECONDS:12096000}

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF